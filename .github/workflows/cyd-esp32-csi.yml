name: CYD original ESP32 CSI firmware

on:
  push:
    paths:
      - "firmware/esp32-cyd-csi/**"
      - ".github/workflows/cyd-esp32-csi.yml"
  pull_request:
    paths:
      - "firmware/esp32-cyd-csi/**"
      - ".github/workflows/cyd-esp32-csi.yml"

# Repeated commits during development must not build obsolete firmware.
concurrency:
  group: cyd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s firmware/esp32-cyd-csi/tools -p 'test_*.py'

  esp32-firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.4
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-WROOM-32 image (no PSRAM)
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C firmware/esp32-cyd-csi set-target esp32
          idf.py -C firmware/esp32-cyd-csi build
      - name: Publish unconfigured display-test firmware
        uses: actions/upload-artifact@v4
        with:
          name: cyd-esp32-s028-test-firmware
          path: |
            firmware/esp32-cyd-csi/build/bootloader/bootloader.bin
            firmware/esp32-cyd-csi/build/partition_table/partition-table.bin
            firmware/esp32-cyd-csi/build/ruview_cyd_csi.bin
          if-no-files-found: error
          retention-days: 7
